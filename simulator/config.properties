# Device Data Simulator configuration, read once at start-up.

# The device whose energy is simulated. Copy its id from the "Id" column of the admin "Devices" page.
# This one is the seed device "Fridge" of the client ion.
device.id=d4eebc99-9c0b-4ef8-bb6d-6bb9bd380a04

# Kafka as seen from the host: docker-compose publishes the kafka container on localhost:9092
kafka.bootstrap.servers=localhost:9092
kafka.topic=device-measurements

# Real seconds between two messages. Each message is one 10-minute measurement, so:
#   600 = real time (one message every 10 minutes)
#   1   = demo mode: one simulated day (144 messages) in about 2.5 minutes
send.interval.seconds=1

# Time of the first measurement, format yyyy-MM-ddTHH:mm (local time, no time zone).
# Empty = now, rounded down to 10 minutes. For the demo use the start of a day, e.g. 2026-11-22T00:00
start.time=
