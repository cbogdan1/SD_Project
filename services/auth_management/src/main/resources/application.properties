###############################################
### DATABASE CONNECTIVITY CONFIGURATIONS ###
###############################################
# localhost:5434 fallback = auth-db as mapped on the host by docker-compose
database.ip = ${DB_IP:localhost}
database.port = ${DB_PORT:5434}
database.user = ${DB_USER:postgres}
database.password = ${DB_PASSWORD:root}
database.name = ${DB_DBNAME:auth_sd}

spring.datasource.url = jdbc:postgresql://${database.ip}:${database.port}/${database.name}
spring.datasource.username = ${database.user}
spring.datasource.password = ${database.password}

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
# Flyway owns the schema; Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto = validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

###############################################
### SECURITY CONFIGURATIONS ###
###############################################
# HS256 needs at least 32 bytes; override JWT_SECRET outside local development
jwt.secret = ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
jwt.expiration-minutes = ${JWT_EXPIRATION_MINUTES:60}

# account created on first start if missing
admin.username = ${ADMIN_USERNAME:admin}
admin.password = ${ADMIN_PASSWORD:admin}

###############################################
### OTHER SERVICES ###
###############################################
services.user.url = ${USER_SERVICE_URL:http://localhost:8080}

###############################################
### LOGGING CONFIGURATIONS ###
###############################################
logging.level.root=info
logging.level.org.springframework=info
logging.level.ro.tuc=info

###############################################
### EMBEDDED TOMCAT CONFIGURATIONS ###
###############################################
server.port=${PORT:8083}
