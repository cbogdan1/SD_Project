###############################################
### DATABASE CONNECTIVITY CONFIGURATIONS ###
###############################################
# localhost:5433 fallback = device-db as mapped on the host by docker-compose
database.ip = ${DB_IP:localhost}
database.port = ${DB_PORT:5433}
database.user = ${DB_USER:postgres}
database.password = ${DB_PASSWORD:root}
database.name = ${DB_DBNAME:device_sd}

spring.datasource.url = jdbc:postgresql://${database.ip}:${database.port}/${database.name}
spring.datasource.username = ${database.user}
spring.datasource.password = ${database.password}

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
# Flyway owns the schema; Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto = validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.show_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

###############################################
### KAFKA ###
###############################################
# localhost:9092 fallback = the kafka container as seen from the host (docker-compose sets kafka:29092)
spring.kafka.bootstrap-servers = ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# key and value are text (Spring's default String(De)Serializer): key = device/user id, value = the event as JSON
# If Kafka is down, the producer gives up after 10 s (default: 2 minutes). Only then does SyncEventPublisher report
# the error, so a rolled-back device change can never be delivered later by a retry.
spring.kafka.producer.properties.max.block.ms = 10000
spring.kafka.producer.properties.request.timeout.ms = 5000
spring.kafka.producer.properties.delivery.timeout.ms = 10000
# the consumer group of this service: every group gets its own copy of each message (publish-subscribe)
spring.kafka.consumer.group-id = device-service
# a new group starts from the oldest message kept by Kafka, so events sent before the first start are not lost
spring.kafka.consumer.auto-offset-reset = earliest

###############################################
### LOGGING CONFIGURATIONS ###
###############################################
logging.level.root=info
logging.level.org.springframework=info
logging.level.ro.tuc=info

###############################################
### EMBEDDED TOMCAT CONFIGURATIONS ###
###############################################
server.port=${PORT:8081}
# use the X-Forwarded-Prefix header set by Traefik (/devices), so Swagger UI builds the right URLs
server.forward-headers-strategy=framework
# Swagger UI at /swagger-ui (http://localhost/devices/swagger-ui through Traefik)
springdoc.swagger-ui.path=/swagger-ui
