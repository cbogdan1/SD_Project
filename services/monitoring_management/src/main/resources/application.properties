###############################################
### DATABASE CONNECTIVITY CONFIGURATIONS ###
###############################################
# localhost:5435 fallback = monitoring-db as mapped on the host by docker-compose
database.ip = ${DB_IP:localhost}
database.port = ${DB_PORT:5435}
database.user = ${DB_USER:postgres}
database.password = ${DB_PASSWORD:root}
database.name = ${DB_DBNAME:monitoring_sd}

spring.datasource.url = jdbc:postgresql://${database.ip}:${database.port}/${database.name}
spring.datasource.username = ${database.user}
spring.datasource.password = ${database.password}

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
# Flyway owns the schema; Hibernate only checks it matches the entities
spring.jpa.hibernate.ddl-auto = validate
spring.jpa.open-in-view=false
# no SQL in the console: with a message every few seconds it would hide the received Kafka messages
spring.jpa.properties.hibernate.show_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

###############################################
### KAFKA ###
###############################################
# localhost:9092 fallback = the kafka container as seen from the host (docker-compose sets kafka:29092)
spring.kafka.bootstrap-servers = ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# key and value are read as text (Spring's default StringDeserializer); the listeners turn the JSON into objects
# the consumer group of this service, for both topics: every group gets its own copy of each message
spring.kafka.consumer.group-id = monitoring-service
# a new group starts from the oldest message kept by Kafka, so nothing sent before the first start is lost
spring.kafka.consumer.auto-offset-reset = earliest

###############################################
### LOGGING CONFIGURATIONS ###
###############################################
logging.level.root=info
logging.level.org.springframework=info
logging.level.ro.tuc=info

###############################################
### EMBEDDED TOMCAT CONFIGURATIONS ###
###############################################
server.port=${PORT:8084}
# use the X-Forwarded-Prefix header set by Traefik (/monitoring), so Swagger UI builds the right URLs
server.forward-headers-strategy=framework
# Swagger UI at /swagger-ui (http://localhost/monitoring/swagger-ui through Traefik)
springdoc.swagger-ui.path=/swagger-ui
