services:
  reverse-proxy:
    image: traefik:v3.6
    container_name: reverse-proxy
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=app-network
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8082:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network

  user-db:
    image: postgres:15-alpine
    container_name: user-postgres
    environment:
      POSTGRES_DB: user_sd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - user-pgdata:/var/lib/postgresql/data
    healthcheck: &pg-healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
    networks:
      - app-network

  device-db:
    image: postgres:15-alpine
    container_name: device-postgres
    environment:
      POSTGRES_DB: device_sd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - device-pgdata:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck
    networks:
      - app-network

  auth-db:
    image: postgres:15-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: auth_sd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5434:5432"
    volumes:
      - auth-pgdata:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck
    networks:
      - app-network

  monitoring-db:
    image: postgres:15-alpine
    container_name: monitoring-postgres
    environment:
      POSTGRES_DB: monitoring_sd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5435:5432"
    volumes:
      - monitoring-pgdata:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck
    networks:
      - app-network

  # Message broker (A2). KRaft mode = no ZooKeeper: this one node is both the broker and the controller.
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    ports:
      - "9092:9092" # for the device simulator, which runs on the host (outside Docker)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL = for the containers, EXTERNAL = for the host, CONTROLLER = used by KRaft itself
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      # the address Kafka gives back to each client: containers use kafka:29092, the host uses localhost:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # only one broker, so Kafka's internal topics can keep only 1 copy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20
    networks:
      - app-network

  auth-service:
    # context = project root: the Maven build needs the parent pom.xml and the common module
    build:
      context: .
      dockerfile: services/auth_management/Dockerfile
    environment:
      - DB_IP=auth-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=root
      - DB_DBNAME=auth_sd
      # override in a .env file next to this one; must be at least 32 characters
      - JWT_SECRET=${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - USER_SERVICE_URL=http://user-service:8080
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - traefik.enable=true
      # only login/register are public; /validate and /credentials stay internal
      - traefik.http.routers.auth.rule=Path(`/auth/login`) || Path(`/auth/register`)
      - traefik.http.routers.auth.entrypoints=web
      - traefik.http.routers.auth.middlewares=auth-strip
      - traefik.http.middlewares.auth-strip.stripprefix.prefixes=/auth
      - traefik.http.services.auth.loadbalancer.server.port=8083
      # Swagger UI and the OpenAPI JSON are public (no token needed)
      - traefik.http.routers.auth-docs.rule=PathPrefix(`/auth/swagger-ui`) || PathPrefix(`/auth/v3/api-docs`)
      - traefik.http.routers.auth-docs.entrypoints=web
      - traefik.http.routers.auth-docs.middlewares=auth-strip
      # ForwardAuth: Traefik asks auth-service /validate before every /users, /devices and /monitoring request
      - traefik.http.middlewares.jwt-auth.forwardauth.address=http://auth-service:8083/validate
      - traefik.http.middlewares.jwt-auth.forwardauth.authResponseHeaders=X-User-Id,X-User-Role

  # no container_name / ports: required so `--scale user-service=N` works; Traefik balances the replicas
  user-service:
    build:
      context: .
      dockerfile: services/user_management/Dockerfile
    environment:
      - DB_IP=user-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=root
      - DB_DBNAME=user_sd
      - AUTH_SERVICE_URL=http://auth-service:8083
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      user-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.users.rule=PathPrefix(`/users`)
      - traefik.http.routers.users.entrypoints=web
      # jwt-auth runs before the strip, so /validate sees the full /users/... path
      - traefik.http.routers.users.middlewares=jwt-auth,users-strip
      # controllers are mapped at /person, so /users/person -> /person
      - traefik.http.middlewares.users-strip.stripprefix.prefixes=/users
      - traefik.http.services.users.loadbalancer.server.port=8080
      # Swagger UI and the OpenAPI JSON are public: no jwt-auth here, only the /users prefix is stripped
      - traefik.http.routers.users-docs.rule=PathPrefix(`/users/swagger-ui`) || PathPrefix(`/users/v3/api-docs`)
      - traefik.http.routers.users-docs.entrypoints=web
      - traefik.http.routers.users-docs.middlewares=users-strip

  device-service:
    build:
      context: .
      dockerfile: services/device_management/Dockerfile
    environment:
      - DB_IP=device-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=root
      - DB_DBNAME=device_sd
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      device-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.devices.rule=PathPrefix(`/devices`)
      - traefik.http.routers.devices.entrypoints=web
      - traefik.http.routers.devices.middlewares=jwt-auth,devices-strip
      # controllers are mapped at /device, so /devices/device -> /device
      - traefik.http.middlewares.devices-strip.stripprefix.prefixes=/devices
      - traefik.http.services.devices.loadbalancer.server.port=8081
      # Swagger UI and the OpenAPI JSON are public: no jwt-auth here, only the /devices prefix is stripped
      - traefik.http.routers.devices-docs.rule=PathPrefix(`/devices/swagger-ui`) || PathPrefix(`/devices/v3/api-docs`)
      - traefik.http.routers.devices-docs.entrypoints=web
      - traefik.http.routers.devices-docs.middlewares=devices-strip

  # A2: reads measurements and sync events from Kafka, stores hourly totals, serves them over REST
  monitoring-service:
    build:
      context: .
      dockerfile: services/monitoring_management/Dockerfile
    environment:
      - DB_IP=monitoring-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=root
      - DB_DBNAME=monitoring_sd
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      monitoring-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.monitoring.rule=PathPrefix(`/monitoring`)
      - traefik.http.routers.monitoring.entrypoints=web
      - traefik.http.routers.monitoring.middlewares=jwt-auth,monitoring-strip
      # controllers are mapped at /consumption, so /monitoring/consumption -> /consumption
      - traefik.http.middlewares.monitoring-strip.stripprefix.prefixes=/monitoring
      - traefik.http.services.monitoring.loadbalancer.server.port=8084
      # Swagger UI and the OpenAPI JSON are public: no jwt-auth here, only the /monitoring prefix is stripped
      - traefik.http.routers.monitoring-docs.rule=PathPrefix(`/monitoring/swagger-ui`) || PathPrefix(`/monitoring/v3/api-docs`)
      - traefik.http.routers.monitoring-docs.entrypoints=web
      - traefik.http.routers.monitoring-docs.middlewares=monitoring-strip

  frontend:
    build: ./frontend
    networks:
      - app-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=web
      # lowest priority: /users, /devices, /monitoring and /auth win, everything else goes to the SPA
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=80

volumes:
  user-pgdata:
  device-pgdata:
  auth-pgdata:
  monitoring-pgdata:

networks:
  app-network:
    name: app-network
    driver: bridge
