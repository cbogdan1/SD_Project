version: '3.8'

services:
  reverse-proxy:
    image: traefik:v3.6
    container_name: reverse-proxy
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=app-network
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8082:8080" # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network

  user-db:
    image: postgres:15-alpine
    container_name: user-postgres
    environment:
      POSTGRES_DB: user_sd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - user-pgdata:/var/lib/postgresql/data
    healthcheck: &pg-healthcheck
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20
    networks:
      - app-network

  device-db:
    image: postgres:15-alpine
    container_name: device-postgres
    environment:
      POSTGRES_DB: device_sd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - device-pgdata:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck
    networks:
      - app-network

  auth-db:
    image: postgres:15-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: auth_sd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5434:5432"
    volumes:
      - auth-pgdata:/var/lib/postgresql/data
    healthcheck: *pg-healthcheck
    networks:
      - app-network

  auth-service:
    build: ./services/auth_management
    environment:
      - DB_IP=auth-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=root
      - DB_DBNAME=auth_sd
      # override in a .env file next to this one; must be at least 32 characters
      - JWT_SECRET=${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - USER_SERVICE_URL=http://user-service:8080
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - traefik.enable=true
      # only login/register are public; /validate and /credentials stay internal
      - traefik.http.routers.auth.rule=Path(`/auth/login`) || Path(`/auth/register`)
      - traefik.http.routers.auth.entrypoints=web
      - traefik.http.routers.auth.middlewares=auth-strip
      - traefik.http.middlewares.auth-strip.stripprefix.prefixes=/auth
      - traefik.http.services.auth.loadbalancer.server.port=8083
      # ForwardAuth: Traefik asks auth-service /validate before every /users and /devices request
      - traefik.http.middlewares.jwt-auth.forwardauth.address=http://auth-service:8083/validate
      - traefik.http.middlewares.jwt-auth.forwardauth.authResponseHeaders=X-User-Id,X-User-Role

  # no container_name / ports: required so `--scale user-service=N` works; Traefik balances the replicas
  user-service:
    build: ./services/user_management
    environment:
      - DB_IP=user-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=root
      - DB_DBNAME=user_sd
      - AUTH_SERVICE_URL=http://auth-service:8083
      - DEVICE_SERVICE_URL=http://device-service:8081
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.users.rule=PathPrefix(`/users`)
      - traefik.http.routers.users.entrypoints=web
      # jwt-auth runs before the strip, so /validate sees the full /users/... path
      - traefik.http.routers.users.middlewares=jwt-auth,users-strip
      # controllers are mapped at /person, so /users/person -> /person
      - traefik.http.middlewares.users-strip.stripprefix.prefixes=/users
      - traefik.http.services.users.loadbalancer.server.port=8080

  device-service:
    build: ./services/device_management
    environment:
      - DB_IP=device-db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=root
      - DB_DBNAME=device_sd
    depends_on:
      device-db:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.devices.rule=PathPrefix(`/devices`)
      - traefik.http.routers.devices.entrypoints=web
      - traefik.http.routers.devices.middlewares=jwt-auth,devices-strip
      # controllers are mapped at /device, so /devices/device -> /device
      - traefik.http.middlewares.devices-strip.stripprefix.prefixes=/devices
      - traefik.http.services.devices.loadbalancer.server.port=8081

  frontend:
    build: ./frontend
    networks:
      - app-network
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=PathPrefix(`/`)
      - traefik.http.routers.frontend.entrypoints=web
      # lowest priority: /users, /devices and /auth win, everything else goes to the SPA
      - traefik.http.routers.frontend.priority=1
      - traefik.http.services.frontend.loadbalancer.server.port=80

volumes:
  user-pgdata:
  device-pgdata:
  auth-pgdata:

networks:
  app-network:
    name: app-network
    driver: bridge
