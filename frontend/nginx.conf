server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing: unknown paths (e.g. refresh on /people) fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API paths only land here when Traefik has no router for them (backend down or still starting).
    # Answer with an error instead of index.html: a 200 HTML page gets cached by the browser as the API response.
    location ~ ^/(users|devices|auth)(/|$) {
        return 503;
    }

    # index.html is also the SPA fallback, so it must never be served from cache
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
